[project]
name = "ftp-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maksim Savrilov", email = "maxim.savrilov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.35.0",
]

[project.scripts]
ftp-project = "ftp_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "openai>=3.19.2",
    "pyyaml>=6.0.3",
    "ruff>=0.16.8",
]
