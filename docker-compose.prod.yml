services:
  master:
    build:
      context: .
      dockerfile: master/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://master:master@postgres:5432/master}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth:8001}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    environment:
      ZITADEL_URL: ${ZITADEL_URL:-http://zitadel-api:8080}
      ZITADEL_CLIENT_ID: ${ZITADEL_CLIENT_ID:?Set ZITADEL_CLIENT_ID to the ZITADEL OAuth client ID}
      ZITADEL_CLIENT_SECRET: ${ZITADEL_CLIENT_SECRET:?Set ZITADEL_CLIENT_SECRET to the ZITADEL OAuth client secret}
    ports:
      - "8001:8001"
    depends_on:
      zitadel-proxy:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: master
      POSTGRES_USER: master
      POSTGRES_PASSWORD: master
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U master -d master"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.16.0
    restart: unless-stopped
    user: "0"

    command:
      - start-from-init
      - --masterkey
      - ${ZITADEL_MASTERKEY:-LocalDevelopmentMasterKey32Chars}
      - --tlsMode
      - disabled

    environment:
      ZITADEL_PORT: 8080

      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8081
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"

      ZITADEL_DATABASE_POSTGRES_DSN: postgres://master:master@postgres:5432/zitadel?sslmode=disable

      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"

      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"

      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:8081/ui/v2/login/

      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:8081/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:8081/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://localhost:8081/ui/v2/login/login?samlRequest=
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME}
    healthcheck:
      test:
        - CMD
        - /app/zitadel
        - ready
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap

    depends_on:
      postgres:
        condition: service_healthy
      # zitadel-init:
      #   condition: service_completed_successfully

    labels:
      - traefik.enable=true

      - traefik.http.services.zitadel-api.loadbalancer.server.port=8080
      - traefik.http.services.zitadel-api.loadbalancer.server.scheme=h2c
      - traefik.docker.network=zitadel
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.prefixes=/api
      - traefik.http.middlewares.zitadel-strip-api.stripprefix.forceSlash=false

      - traefik.http.routers.zitadel-api.rule=Host(`localhost`) && PathPrefix(`/api`)
      - traefik.http.routers.zitadel-api.entrypoints=web
      - traefik.http.routers.zitadel-api.middlewares=zitadel-strip-api
      - traefik.http.routers.zitadel-api.service=zitadel-api
      - traefik.http.routers.zitadel-api.priority=200

      - traefik.http.routers.zitadel-canonical.rule=Host(`localhost`) && !PathPrefix(`/ui/v2/login`) && !PathPrefix(`/api`)
      - traefik.http.routers.zitadel-canonical.entrypoints=web
      - traefik.http.routers.zitadel-canonical.service=zitadel-api
      - traefik.http.routers.zitadel-canonical.priority=100


  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.0
    restart: unless-stopped
    user: "0"

    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:localhost,X-Forwarded-Proto:http

    healthcheck:
      test:
        - CMD
        - /bin/sh
        - -c
        - node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro

    depends_on:
      zitadel-api:
        condition: service_healthy

    labels:
      - traefik.enable=true
      - traefik.docker.network=zitadel
      - traefik.http.services.zitadel-login.loadbalancer.server.port=3000

      - traefik.http.routers.zitadel-login.rule=Host(`localhost`) && PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-login.entrypoints=web
      - traefik.http.routers.zitadel-login.service=zitadel-login
      - traefik.http.routers.zitadel-login.priority=250


  zitadel-proxy:
    image: traefik:v3.7.7
    restart: unless-stopped

    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.network=zitadel
      - --entrypoints.web.address=:80
      - --ping=true
      - --ping.entrypoint=web

    ports:
      - "8081:80"

    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro

    depends_on:
      zitadel-api:
        condition: service_started
      zitadel-login:
        condition: service_started

  # zitadel-init:
  #   image: ghcr.io/zitadel/zitadel:v4.16.0
  #   user: "0"
  #   command:
  #     - init
  #   environment:
  #     ZITADEL_EXTERNALDOMAIN: localhost
  #     ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"

  #     ZITADEL_DATABASE_POSTGRES_DSN: postgres://master:master@postgres:5432/zitadel?sslmode=disable

  #     ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
  #     ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
  #     ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
  #     ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"

  #   volumes:
  #     - zitadel-bootstrap:/zitadel/bootstrap

  #   depends_on:
  #     postgres:
  #       condition: service_healthy

volumes:
  zitadel-bootstrap:
  postgres-data:

networks:
  default:
    name: zitadel
