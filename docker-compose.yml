services:
  master:
    build:
      context: .
      dockerfile: master/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://master:master@postgres:5432/master}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://zitadel:8080}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      zitadel:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: master
      POSTGRES_USER: master
      POSTGRES_PASSWORD: master
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U master -d master"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    networks:
        - zitadel

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    command:
      - start-from-init
      - --masterkey
      - ${ZITADEL_MASTERKEY:-LocalDevelopmentMasterKey32Chars}
      - --tlsMode
      - disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_DSN: postgres://master:master@postgres:5432/zitadel?sslmode=disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8081
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  dsl:
    image: docker.io/structurizr/structurizr
    user: "0:0"
    volumes:
      - ./structurizr:/usr/local/structurizr
    ports:
      - "8080:8080"
    environment:
      - STRUCTURIZR_AUTOREFRESHINTERVAL=2000
    command: ["local"]

  plesk:
    image: docker.io/plesk/plesk@sha256:9f64a358dedb850860aed92124c3bb865c572d15747f4f886f4f66e9f28a31ab
    user: "0:0"
    security_opt:
      - label:disable
      # - seccomp:unconfined
    # cgroupns_mode: host
    # network_mode: host
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SYS_CHROOT
    tmpfs:
      - /tmp
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - "./dockerenv_mock:/.dockerenv:ro"
    ports:
      - "8880:8880"
      - "8443:8443"
      - "8447:8447"
    environment:
      - PLESK_ADMIN_PASSWORD=changeme1Q**
      - PLESK_VIRTUALIZATION=docker
      - container=docker

volumes:
  postgres-data:
