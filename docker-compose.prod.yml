services:
  master:
    build:
      context: .
      dockerfile: master/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://master:master@postgres:5432/master}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://zitadel:8080}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      zitadel:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: master
      POSTGRES_USER: master
      POSTGRES_PASSWORD: master
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U master -d master"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    command:
      - start-from-init
      - --masterkey
      - ${ZITADEL_MASTERKEY:-LocalDevelopmentMasterKey32Chars}
      - --tlsMode
      - disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_DSN: postgres://master:master@postgres:5432/zitadel?sslmode=disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8081
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
